[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relief"
version = "0.2.1"
description = "RELIEF: an agent that finds why cashless treatment is blocked and prepares the next step for a human to approve."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "pydantic>=2.7",
  "ollama>=0.4",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "chromadb>=1.0",
  "scikit-learn>=1.4",
  "rapidfuzz>=3.6",
  "pytesseract>=0.3.10",
  "pillow>=10",
  "jinja2>=3.1",
  "apscheduler>=3.10,<4",
  "python-dateutil>=2.9",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pypdf>=4",
]

[project.optional-dependencies]
bge = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relief = ["tools/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
